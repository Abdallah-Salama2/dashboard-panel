version: '3.8'

services:
  # خدمة الـ Frontend
  frontend:
    build: .
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - mock-api

  # خدمة الـ Mock API (الـ json-server)
  mock-api:
    image: node:18-alpine
    working_dir: /data
    volumes:
      - .:/data
    ports:
      - "5000:5000"
    command: npx json-server --watch db.json --port 5000 --host 0.0.0.0